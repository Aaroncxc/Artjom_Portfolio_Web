<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The House - 3D Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
      overflow: hidden;
    }
    
    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    
    #canvas-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #canvas-container canvas {
      display: block;
    }
    
    .top-bar {
      position: absolute;
      top: clamp(12px, 3vw, 24px);
      left: clamp(12px, 3vw, 24px);
      right: clamp(12px, 3vw, 24px);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
    }
    
    .stats {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      font-size: clamp(12px, 2.5vw, 11px);
      color: rgba(28, 28, 28, 0.6);
      border: 1px solid rgba(28, 28, 28, 0.06);
    }
    
    .stat-item .label {
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    
    .stat-item .value {
      color: rgba(28, 28, 28, 0.9);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    
    .controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      top: 0;
      pointer-events: none;
      z-index: 10;
    }
    
    .controls-inner {
      position: absolute;
      bottom: clamp(12px, 3vw, 24px);
      left: clamp(12px, 3vw, 24px);
      right: clamp(12px, 3vw, 24px);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      gap: 8px;
    }
    
    .controls-inner .btn {
      pointer-events: auto;
    }
    
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: clamp(44px, 12vmin, 56px);
      height: clamp(44px, 12vmin, 56px);
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(28, 28, 28, 0.1);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      color: rgba(28, 28, 28, 0.7);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 12px rgba(28, 28, 28, 0.08);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    
    .btn:hover {
      background: rgba(255, 255, 255, 0.95);
      color: rgba(28, 28, 28, 0.9);
      transform: scale(1.05);
    }
    
    .btn.active {
      background: #14B8A6;
      color: white;
      border-color: #14B8A6;
    }
    
    .btn svg {
      width: clamp(20px, 5vmin, 24px);
      height: clamp(20px, 5vmin, 24px);
    }
    
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(28, 28, 28, 0.6);
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(20, 184, 166, 0.2);
      border-top-color: #14B8A6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading.hidden {
      display: none;
    }
    
    /* Accent button style for roof toggle */
    .btn-accent {
      background: rgba(20, 184, 166, 0.15) !important;
      border-color: rgba(20, 184, 166, 0.4) !important;
      color: #0d9488 !important;
    }
    
    .btn-accent:hover {
      background: rgba(20, 184, 166, 0.25) !important;
      border-color: rgba(20, 184, 166, 0.6) !important;
    }
    
    .btn-accent.roof-hidden {
      background: rgba(239, 68, 68, 0.15) !important;
      border-color: rgba(239, 68, 68, 0.4) !important;
      color: #dc2626 !important;
    }
    
    .btn-accent.roof-hidden:hover {
      background: rgba(239, 68, 68, 0.25) !important;
      border-color: rgba(239, 68, 68, 0.6) !important;
    }
    
    /* First Person mode */
    .btn-fp {
      background: rgba(99, 102, 241, 0.15) !important;
      border-color: rgba(99, 102, 241, 0.4) !important;
      color: #4f46e5 !important;
    }
    .btn-fp:hover {
      background: rgba(99, 102, 241, 0.25) !important;
      border-color: rgba(99, 102, 241, 0.6) !important;
    }
.btn-fp.active {
      background: rgba(99, 102, 241, 0.9) !important;
      border-color: rgba(99, 102, 241, 1) !important;
      color: white !important;
    }

    /* Dropdown for camera views */
    .camera-dropdown {
      position: relative;
      pointer-events: auto;
    }
    .camera-dropdown .btn-dropdown {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 14px;
      border-radius: 28px;
      min-width: 44px;
      height: clamp(44px, 12vmin, 56px);
      font-size: 13px;
      font-weight: 500;
    }
    .camera-dropdown .btn-dropdown svg {
      width: 20px;
      height: 20px;
    }
    .camera-dropdown-menu {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      min-width: 180px;
      padding: 6px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(28, 28, 28, 0.1);
      box-shadow: 0 8px 24px rgba(28, 28, 28, 0.12);
      z-index: 100;
    }
    .camera-dropdown-menu.open {
      display: block;
    }
    .camera-dropdown-menu button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: rgba(28, 28, 28, 0.9);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      text-align: left;
    }
    .camera-dropdown-menu button:hover {
      background: rgba(20, 184, 166, 0.12);
      color: #0d9488;
    }
    .camera-dropdown-menu button svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.7;
    }
    
    #fp-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 20;
      pointer-events: none;
    }
    #fp-overlay.visible {
      display: block;
    }
    
    .fp-crosshair {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 20px; height: 20px;
    }
    .fp-crosshair::before, .fp-crosshair::after {
      content: '';
      position: absolute;
      background: rgba(28, 28, 28, 0.5);
      border-radius: 1px;
    }
    .fp-crosshair::before {
      width: 2px; height: 100%;
      left: 50%; transform: translateX(-50%);
    }
    .fp-crosshair::after {
      width: 100%; height: 2px;
      top: 50%; transform: translateY(-50%);
    }
    
    .fp-hint {
      position: absolute;
      bottom: clamp(80px, 15vmin, 100px);
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      border-radius: 12px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      color: white;
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
      white-space: nowrap;
      transition: opacity 0.3s;
    }
    .fp-hint kbd {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      font-family: inherit;
      font-size: 12px;
    }
    
    /* Touch joystick */
    .touch-joystick {
      display: none;
      position: absolute;
      bottom: 100px;
      left: 40px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(0,0,0,0.2);
      border: 2px solid rgba(255,255,255,0.3);
      z-index: 25;
      touch-action: none;
    }
    .touch-joystick .knob {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      border: 2px solid rgba(255,255,255,0.7);
      pointer-events: none;
      transition: none;
    }
    .touch-look-area {
      display: none;
      position: absolute;
      top: 0; right: 0;
      width: 50%;
      height: 100%;
      z-index: 24;
      touch-action: none;
    }
    #fp-overlay.visible .touch-joystick,
    #fp-overlay.visible .touch-look-area {
      display: block;
    }
    /* Hide joystick on desktop */
    @media (hover: hover) and (pointer: fine) {
      .touch-joystick, .touch-look-area {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="canvas-container"></div>
    
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Loading 3D Model...</p>
      <p id="progress" style="font-size: 12px; margin-top: 8px; opacity: 0.7;"></p>
    </div>
    
    <div class="top-bar">
      <div class="stats" id="stats">
        <div class="stat-item">
          <span class="label">Vertices</span>
          <span class="value" id="vertex-count">—</span>
        </div>
        <div class="stat-item">
          <span class="label">Triangles</span>
          <span class="value" id="triangle-count">—</span>
        </div>
      </div>
    </div>
    
    <!-- First Person HUD overlay -->
    <div id="fp-overlay">
      <div class="fp-crosshair"></div>
      <div class="fp-hint" id="fp-hint">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Bewegen &nbsp;&bull;&nbsp; <kbd>Maus</kbd> Umsehen &nbsp;&bull;&nbsp; <kbd>ESC</kbd> Beenden
      </div>
      <!-- Touch: virtual joystick for movement -->
      <div class="touch-joystick" id="touch-joystick">
        <div class="knob" id="joystick-knob"></div>
      </div>
      <!-- Touch: right side for looking around -->
      <div class="touch-look-area" id="touch-look-area"></div>
    </div>
    
    <div class="controls">
      <div class="controls-inner">
        <button class="btn" id="wireframe-btn" onclick="toggleWireframe()" title="Wireframe">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/>
          </svg>
        </button>
        <!-- First Person Button -->
        <button class="btn btn-fp" id="fp-btn" onclick="toggleFirstPerson()" title="First Person Modus">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/>
          </svg>
        </button>
        <!-- Camera views dropdown -->
        <div class="camera-dropdown" id="camera-dropdown">
          <button class="btn btn-accent btn-dropdown" id="camera-dropdown-btn" onclick="toggleCameraDropdown()" title="Kameraansichten">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <span>Kamera</span>
          </button>
          <div class="camera-dropdown-menu" id="camera-dropdown-menu">
            <button type="button" onclick="goToOverview(); closeCameraDropdown();">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
              Ãœbersicht
            </button>
            <button type="button" onclick="goToView2(); closeCameraDropdown();">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              Nahansicht
            </button>
            <button type="button" onclick="goToView3(); closeCameraDropdown();">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v4a1 1 0 001 1h3m10-5v4a1 1 0 01-1 1h-3m-4 0h4m-8 4v2a2 2 0 002 2h8a2 2 0 002-2v-2M5 12h14"/></svg>
              Badezimmer
            </button>
            <button type="button" onclick="goToView4(); closeCameraDropdown();">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 4V20M17 4V20M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"/></svg>
              RÃ¼ckansicht
            </button>
          </div>
        </div>
        <!-- Roof Toggle Button -->
        <button class="btn btn-accent" id="roof-btn" onclick="toggleRoof()" title="Dach ein/ausblenden">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" id="roof-icon">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    let scene, camera, renderer, controls;
    let fpControls; // PointerLockControls
    let model, wireframeGroup, gridHelper;
    let showWireframe = false;
    
    // Roof toggle
    let roofMesh = null;
    let roofVisible = true;
    let isAnimating = false;
    
    // Camera animation
    let cameraAnimating = false;
    let cameraStartPos = new THREE.Vector3();
    let cameraEndPos = new THREE.Vector3();
    let cameraStartTarget = new THREE.Vector3();
    let cameraEndTarget = new THREE.Vector3();
    let cameraAnimProgress = 0;
    
    // Original camera position (to return to)
    const originalCameraPos = new THREE.Vector3(-0.59, 1.78, 5.07);
    const originalTarget = new THREE.Vector3(0.01, 0.43, 0.16);
    // Inside view camera position (when roof is hidden)
    const insideCameraPos = new THREE.Vector3(0.13, 1.36, -0.34);
    const insideTarget = new THREE.Vector3(0.29, 1.11, -0.29);
    // Second view (detail/nah)
    const view2CameraPos = new THREE.Vector3(0.08, 0.18, -0.81);
    const view2Target = new THREE.Vector3(0.31, 0.21, -0.61);
    // Third view (Badezimmer)
    const view3CameraPos = new THREE.Vector3(0.86, 0.58, 0.70);
    const view3Target = new THREE.Vector3(0.74, 0.33, 0.59);
    
    // Fourth view (RÃ¼ckansicht)
    const view4CameraPos = new THREE.Vector3(0.68, 0.24, -0.73);
    const view4Target = new THREE.Vector3(0.87, 0.15, -0.51);
    
    // ========== FIRST PERSON MODE ==========
    let firstPersonActive = false;
    const fpStartPos = new THREE.Vector3(-0.28, 0.24, -0.04);
    const fpStartLookAt = new THREE.Vector3(0.46, 0.20, -0.04);
    const fpMoveSpeed = 0.8; // units per second
    const fpHeight = 0.24; // camera height
    const fpCollisionDistance = 0.08; // how close to walls before stopping
    
    // WASD state
    const keysPressed = { w: false, a: false, s: false, d: false };
    
    // Collision raycaster
    const collisionRaycaster = new THREE.Raycaster();
    const collisionDirections = [
      new THREE.Vector3(0, 0, -1),  // forward
      new THREE.Vector3(0, 0, 1),   // backward
      new THREE.Vector3(-1, 0, 0),  // left
      new THREE.Vector3(1, 0, 0),   // right
    ];
    let collisionMeshes = []; // filled after model loads
    
    // Clock for delta time
    const fpClock = new THREE.Clock(false);
    
    // Touch controls state
    let touchJoystickActive = false;
    let touchJoystickCenter = { x: 0, y: 0 };
    let touchJoystickInput = { x: 0, y: 0 }; // -1 to 1
    let touchJoystickTouchId = null;
    
    let touchLookActive = false;
    let touchLookLastPos = { x: 0, y: 0 };
    let touchLookTouchId = null;
    const touchLookSensitivity = 0.003;
    
    // Euler for touch look rotation
    let fpEuler = new THREE.Euler(0, 0, 0, 'YXZ');
    let isTouchDevice = false;

    const container = document.getElementById('canvas-container');
    const loadingEl = document.getElementById('loading');
    const progressEl = document.getElementById('progress');
    const wireframeBtn = document.getElementById('wireframe-btn');
    const fpBtn = document.getElementById('fp-btn');
    const fpOverlay = document.getElementById('fp-overlay');
    const roofBtn = document.getElementById('roof-btn');
    const cameraDropdown = document.getElementById('camera-dropdown-menu');
    const cameraDropdownBtn = document.getElementById('camera-dropdown-btn');
    const vertexCountEl = document.getElementById('vertex-count');
    const triangleCountEl = document.getElementById('triangle-count');

    function init() {
      // Scene
      scene = new THREE.Scene();
      scene.background = null;

      // Camera
      const width = container.clientWidth;
      const height = container.clientHeight;
      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(-0.59, 1.78, 5.07);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.VSMShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      container.appendChild(renderer.domElement);

      // Controls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.3;
      controls.enablePan = true;
      controls.minDistance = 0.3;
      controls.maxDistance = 30;
      controls.target.set(0.01, 0.43, 0.16);
      
      // PointerLockControls for first person
      fpControls = new PointerLockControls(camera, renderer.domElement);
      
      // When pointer lock is lost (ESC), exit first person
      fpControls.addEventListener('unlock', () => {
        if (firstPersonActive) {
          exitFirstPerson();
        }
      });
      
      // Expose for console / C key
      window.camera = camera;
      window.controls = controls;

      // Grid Helper
      gridHelper = new THREE.GridHelper(20, 40, 0x14B8A6, 0xcccccc);
      gridHelper.material.opacity = 0.15;
      gridHelper.material.transparent = true;
      gridHelper.position.y = 0;
      scene.add(gridHelper);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
      mainLight.position.set(5, 15, 10);
      mainLight.castShadow = true;
      mainLight.shadow.mapSize.width = 2048;
      mainLight.shadow.mapSize.height = 2048;
      mainLight.shadow.camera.near = 1;
      mainLight.shadow.camera.far = 50;
      mainLight.shadow.camera.left = -15;
      mainLight.shadow.camera.right = 15;
      mainLight.shadow.camera.top = 15;
      mainLight.shadow.camera.bottom = -15;
      mainLight.shadow.bias = -0.0005;
      scene.add(mainLight);

      const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
      fillLight.position.set(-5, 5, -5);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight(0x88ccff, 0.3);
      rimLight.position.set(0, -5, -10);
      scene.add(rimLight);

      // Ground plane for shadows
      const groundGeo = new THREE.PlaneGeometry(30, 30);
      const shadowMat = new THREE.ShadowMaterial({ opacity: 0.3 });
      const groundPlane = new THREE.Mesh(groundGeo, shadowMat);
      groundPlane.rotation.x = -Math.PI / 2;
      groundPlane.position.y = 0;
      groundPlane.receiveShadow = true;
      scene.add(groundPlane);

      loadModel();
      window.addEventListener('resize', onResize);
      
      // Key handling: C for camera log, WASD for first person movement
      window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'c') {
          const p = camera.position;
          const t = controls.target;
          console.log('Camera position:', p.x.toFixed(3), p.y.toFixed(3), p.z.toFixed(3));
          console.log('Target:', t.x.toFixed(3), t.y.toFixed(3), t.z.toFixed(3));
          console.log('Copy for code: new THREE.Vector3(' + p.x.toFixed(2) + ', ' + p.y.toFixed(2) + ', ' + p.z.toFixed(2) + '), target: new THREE.Vector3(' + t.x.toFixed(2) + ', ' + t.y.toFixed(2) + ', ' + t.z.toFixed(2) + ')');
        }
        if (key in keysPressed) keysPressed[key] = true;
      });
      window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (key in keysPressed) keysPressed[key] = false;
      });
      
      // ========== TOUCH CONTROLS SETUP ==========
      const joystickEl = document.getElementById('touch-joystick');
      const knobEl = document.getElementById('joystick-knob');
      const lookAreaEl = document.getElementById('touch-look-area');
      
      // Joystick touch events
      joystickEl.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.changedTouches[0];
        touchJoystickTouchId = touch.identifier;
        touchJoystickActive = true;
        const rect = joystickEl.getBoundingClientRect();
        touchJoystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      }, { passive: false });
      
      joystickEl.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const touch = e.changedTouches[i];
          if (touch.identifier === touchJoystickTouchId) {
            const dx = touch.clientX - touchJoystickCenter.x;
            const dy = touch.clientY - touchJoystickCenter.y;
            const maxR = 50; // max radius
            const dist = Math.min(Math.sqrt(dx * dx + dy * dy), maxR);
            const angle = Math.atan2(dy, dx);
            
            // Normalized input (-1 to 1)
            touchJoystickInput.x = (dist / maxR) * Math.cos(angle);
            touchJoystickInput.y = (dist / maxR) * Math.sin(angle);
            
            // Move knob visually
            const knobX = (dist / maxR) * maxR * Math.cos(angle);
            const knobY = (dist / maxR) * maxR * Math.sin(angle);
            knobEl.style.transform = 'translate(calc(-50% + ' + knobX + 'px), calc(-50% + ' + knobY + 'px))';
          }
        }
      }, { passive: false });
      
      const resetJoystick = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === touchJoystickTouchId) {
            touchJoystickActive = false;
            touchJoystickInput = { x: 0, y: 0 };
            touchJoystickTouchId = null;
            knobEl.style.transform = 'translate(-50%, -50%)';
          }
        }
      };
      joystickEl.addEventListener('touchend', resetJoystick, { passive: false });
      joystickEl.addEventListener('touchcancel', resetJoystick, { passive: false });
      
      // Look area touch events (right half of screen)
      lookAreaEl.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.changedTouches[0];
        touchLookTouchId = touch.identifier;
        touchLookActive = true;
        touchLookLastPos = { x: touch.clientX, y: touch.clientY };
      }, { passive: false });
      
      lookAreaEl.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const touch = e.changedTouches[i];
          if (touch.identifier === touchLookTouchId) {
            const dx = touch.clientX - touchLookLastPos.x;
            const dy = touch.clientY - touchLookLastPos.y;
            touchLookLastPos = { x: touch.clientX, y: touch.clientY };
            
            // Rotate camera
            fpEuler.setFromQuaternion(camera.quaternion);
            fpEuler.y -= dx * touchLookSensitivity;
            fpEuler.x -= dy * touchLookSensitivity;
            fpEuler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, fpEuler.x));
            camera.quaternion.setFromEuler(fpEuler);
          }
        }
      }, { passive: false });
      
      const resetLook = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === touchLookTouchId) {
            touchLookActive = false;
            touchLookTouchId = null;
          }
        }
      };
      lookAreaEl.addEventListener('touchend', resetLook, { passive: false });
      lookAreaEl.addEventListener('touchcancel', resetLook, { passive: false });
      
      animate();
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toLocaleString();
    }

    function countGeometry(object) {
      let vertices = 0, triangles = 0;
      object.traverse((child) => {
        if (child.isMesh && child.geometry) {
          const geo = child.geometry;
          if (geo.index) triangles += geo.index.count / 3;
          else if (geo.attributes.position) triangles += geo.attributes.position.count / 3;
          if (geo.attributes.position) vertices += geo.attributes.position.count;
        }
      });
      return { vertices, triangles: Math.floor(triangles) };
    }

    function loadModel() {
      const loader = new FBXLoader();
      
      loader.load('./model.fbx', (fbx) => {
        // Scale and position
        const box = new THREE.Box3().setFromObject(fbx);
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 5 / maxDim;
        
        fbx.scale.setScalar(scale);
        fbx.updateMatrixWorld(true);
        
        // Center the model
        const boxScaled = new THREE.Box3().setFromObject(fbx);
        const center = boxScaled.getCenter(new THREE.Vector3());
        fbx.position.set(-center.x, -boxScaled.min.y, -center.z);

        // Materials & shadows + find roof mesh
        fbx.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            
            // Find the roof mesh by name
            const meshName = (child.name || '').toUpperCase();
            if (meshName.includes('DACH') || meshName.includes('ROOF') || meshName.includes('AUSBLENDEN')) {
              console.log('Found roof mesh:', child.name);
              roofMesh = child;
              // Make material transparent-capable
              if (child.material) {
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                mats.forEach(mat => {
                  mat.transparent = true;
                  mat.opacity = 1.0;
                });
              }
            }
            
            if (child.material) {
              const mats = Array.isArray(child.material) ? child.material : [child.material];
              mats.forEach(mat => {
                mat.metalness = 0.1;
                mat.roughness = 0.7;
                if (mat.map) mat.map.needsUpdate = true;
              });
            }
          }
        });
        
        if (!roofMesh) {
          console.log('No roof mesh found. Available meshes:');
          fbx.traverse((child) => {
            if (child.isMesh) console.log('  -', child.name);
          });
        }

        scene.add(fbx);
        model = fbx;

        // Stats
        const stats = countGeometry(fbx);
        vertexCountEl.textContent = '935,000';
        triangleCountEl.textContent = '904,035';

        // Wireframe
        wireframeGroup = new THREE.Group();
        fbx.traverse((child) => {
          if (child.isMesh) {
            const wireGeo = new THREE.WireframeGeometry(child.geometry);
            const wireMat = new THREE.LineBasicMaterial({ color: 0x14B8A6, transparent: true, opacity: 0.7 });
            const wire = new THREE.LineSegments(wireGeo, wireMat);
            wire.position.copy(child.position);
            wire.rotation.copy(child.rotation);
            wire.scale.copy(child.scale);
            wireframeGroup.add(wire);
          }
        });
        wireframeGroup.scale.copy(fbx.scale);
        wireframeGroup.position.copy(fbx.position);
        wireframeGroup.visible = false;
        scene.add(wireframeGroup);

        // Collect meshes for collision detection (exclude roof)
        fbx.traverse((child) => {
          if (child.isMesh && child !== roofMesh) {
            collisionMeshes.push(child);
          }
        });
        console.log('Collision meshes:', collisionMeshes.length);

        loadingEl.classList.add('hidden');
      },
      (progress) => {
        if (progress.total > 0) {
          progressEl.textContent = Math.round((progress.loaded / progress.total) * 100) + '%';
        }
      },
      (error) => {
        console.error('Error loading model:', error);
        progressEl.textContent = 'Failed to load model';
      });
    }

    function onResize() {
      const width = container.clientWidth;
      const height = container.clientHeight;
      if (width === 0 || height === 0) return;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    // Easing function for smooth animation
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // Check if movement in a direction is blocked by collision
    function canMove(direction, distance) {
      if (collisionMeshes.length === 0) return true;
      
      // Cast ray from camera position in the movement direction
      const origin = camera.position.clone();
      collisionRaycaster.set(origin, direction.clone().normalize());
      collisionRaycaster.far = distance + fpCollisionDistance;
      
      const intersects = collisionRaycaster.intersectObjects(collisionMeshes, false);
      return intersects.length === 0;
    }

    function animate() {
      requestAnimationFrame(animate);
      
      // ========== FIRST PERSON MOVEMENT ==========
      if (firstPersonActive && (fpControls.isLocked || isTouchDevice)) {
        const delta = fpClock.getDelta();
        if (delta > 0.1) return; // skip large jumps
        
        const speed = fpMoveSpeed * delta;
        
        // Get camera forward/right vectors (horizontal only)
        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();
        
        const right = new THREE.Vector3();
        right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
        
        // Build movement vector from WASD + touch joystick
        const moveDir = new THREE.Vector3(0, 0, 0);
        if (keysPressed.w) moveDir.add(forward);
        if (keysPressed.s) moveDir.sub(forward);
        if (keysPressed.d) moveDir.add(right);
        if (keysPressed.a) moveDir.sub(right);
        
        // Add touch joystick input (x = left/right, y = up/down on screen = forward/back)
        if (touchJoystickActive) {
          moveDir.addScaledVector(forward, -touchJoystickInput.y); // up on screen = forward
          moveDir.addScaledVector(right, touchJoystickInput.x);
        }
        
        if (moveDir.length() > 0) {
          moveDir.normalize();
          
          // Check collision separately for each axis
          const moveX = new THREE.Vector3(moveDir.x, 0, 0);
          const moveZ = new THREE.Vector3(0, 0, moveDir.z);
          
          if (moveX.length() > 0 && canMove(moveX.normalize(), speed)) {
            camera.position.x += moveDir.x * speed;
          }
          if (moveZ.length() > 0 && canMove(moveZ.normalize(), speed)) {
            camera.position.z += moveDir.z * speed;
          }
          
          // Lock Y position to fpHeight
          camera.position.y = fpHeight;
        }
      }
      
      // Handle camera animation (orbit mode)
      if (!firstPersonActive && cameraAnimating) {
        cameraAnimProgress += 0.015;
        const t = Math.min(cameraAnimProgress, 1);
        const eased = easeInOutCubic(t);
        
        camera.position.lerpVectors(cameraStartPos, cameraEndPos, eased);
        const currentTarget = new THREE.Vector3().lerpVectors(cameraStartTarget, cameraEndTarget, eased);
        controls.target.copy(currentTarget);
        
        if (t >= 1) {
          cameraAnimating = false;
          cameraAnimProgress = 0;
        }
      }
      
      if (!firstPersonActive) {
        controls.update();
      }
      
      if (model && wireframeGroup) {
        wireframeGroup.rotation.copy(model.rotation);
        wireframeGroup.position.copy(model.position);
      }
      renderer.render(scene, camera);
    }

    window.toggleCameraDropdown = function() {
      if (cameraDropdown) cameraDropdown.classList.toggle('open');
    };
    window.closeCameraDropdown = function() {
      if (cameraDropdown) cameraDropdown.classList.remove('open');
    };
    document.addEventListener('click', function(e) {
      if (cameraDropdown && cameraDropdown.classList.contains('open') && !cameraDropdown.contains(e.target) && !cameraDropdownBtn.contains(e.target)) {
        cameraDropdown.classList.remove('open');
      }
    });
    
    window.toggleWireframe = function() {
      showWireframe = !showWireframe;
      if (wireframeGroup) wireframeGroup.visible = showWireframe;
      wireframeBtn.classList.toggle('active', showWireframe);
    };
    
    // Toggle roof visibility with fade and camera animation
    window.toggleRoof = function() {
      if (!roofMesh || isAnimating) return;
      
      isAnimating = true;
      const duration = 800; // ms
      const startTime = performance.now();
      const startOpacity = roofVisible ? 1 : 0;
      const endOpacity = roofVisible ? 0 : 1;
      
      // Start camera animation
      cameraStartPos.copy(camera.position);
      cameraStartTarget.copy(controls.target);
      
      if (roofVisible) {
        // Roof is hiding - move camera to inside view
        cameraEndPos.copy(insideCameraPos);
        cameraEndTarget.copy(insideTarget);
        controls.autoRotate = false; // Stop auto-rotate when looking inside
      } else {
        // Roof is showing - move camera back to original view
        cameraEndPos.copy(originalCameraPos);
        cameraEndTarget.copy(originalTarget);
        controls.autoRotate = true; // Resume auto-rotate
      }
      
      cameraAnimProgress = 0;
      cameraAnimating = true;
      
      // Fade animation for roof
      function animateFade() {
        const elapsed = performance.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = easeInOutCubic(progress);
        
        // Update roof opacity
        if (roofMesh.material) {
          const mats = Array.isArray(roofMesh.material) ? roofMesh.material : [roofMesh.material];
          mats.forEach(mat => {
            mat.opacity = startOpacity + (endOpacity - startOpacity) * eased;
          });
        }
        
        if (progress < 1) {
          requestAnimationFrame(animateFade);
        } else {
          // Animation complete
          roofVisible = !roofVisible;
          isAnimating = false;
          roofBtn.classList.toggle('roof-hidden', !roofVisible);
          
          // Hide mesh completely when fully faded
          if (!roofVisible) {
            roofMesh.visible = false;
          }
        }
      }
      
      // Show mesh if it was hidden
      if (!roofVisible) {
        roofMesh.visible = true;
      }
      
      animateFade();
    };
    
    // Kamera zur Nahansicht führen
    window.goToView2 = function() {
      if (cameraAnimating || firstPersonActive) return;
      cameraStartPos.copy(camera.position);
      cameraStartTarget.copy(controls.target);
      cameraEndPos.copy(view2CameraPos);
      cameraEndTarget.copy(view2Target);
      cameraAnimProgress = 0;
      cameraAnimating = true;
      controls.autoRotate = false;
    };
    
    // Kamera zum Badezimmer führen
    window.goToView3 = function() {
      if (cameraAnimating || firstPersonActive) return;
      cameraStartPos.copy(camera.position);
      cameraStartTarget.copy(controls.target);
      cameraEndPos.copy(view3CameraPos);
      cameraEndTarget.copy(view3Target);
      cameraAnimProgress = 0;
      cameraAnimating = true;
      controls.autoRotate = false;
    };
    
    window.goToView4 = function() {
      if (cameraAnimating || firstPersonActive) return;
      cameraStartPos.copy(camera.position);
      cameraStartTarget.copy(controls.target);
      cameraEndPos.copy(view4CameraPos);
      cameraEndTarget.copy(view4Target);
      cameraAnimProgress = 0;
      cameraAnimating = true;
      controls.autoRotate = false;
    };
    
    window.goToOverview = function() {
      if (cameraAnimating || firstPersonActive) return;
      cameraStartPos.copy(camera.position);
      cameraStartTarget.copy(controls.target);
      cameraEndPos.copy(originalCameraPos);
      cameraEndTarget.copy(originalTarget);
      cameraAnimProgress = 0;
      cameraAnimating = true;
      controls.autoRotate = true;
    };
    
    // ========== FIRST PERSON TOGGLE ==========
    function enterFirstPerson() {
      firstPersonActive = true;
      
      // Detect touch device
      isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      
      // Disable orbit controls
      controls.enabled = false;
      controls.autoRotate = false;
      
      // Position camera at start
      camera.position.copy(fpStartPos);
      
      // Look at the target direction
      camera.lookAt(fpStartLookAt);
      fpEuler.setFromQuaternion(camera.quaternion);
      
      // Lock pointer (desktop only - mobile uses touch look area)
      if (!isTouchDevice) {
        fpControls.lock();
      }
      fpClock.start();
      
      // Show overlay
      fpOverlay.classList.add('visible');
      fpBtn.classList.add('active');
      
      // Hide hint after 4 seconds
      const hint = document.getElementById('fp-hint');
      hint.style.opacity = '1';
      setTimeout(() => { hint.style.opacity = '0'; }, 4000);
      
      console.log('First Person Mode ON');
    }
    
    function exitFirstPerson() {
      firstPersonActive = false;
      
      // Unlock pointer if locked
      if (fpControls.isLocked) {
        fpControls.unlock();
      }
      fpClock.stop();
      
      // Reset keys
      keysPressed.w = false;
      keysPressed.a = false;
      keysPressed.s = false;
      keysPressed.d = false;
      
      // Reset touch state
      touchJoystickActive = false;
      touchJoystickInput = { x: 0, y: 0 };
      touchLookActive = false;
      
      // Re-enable orbit controls
      controls.enabled = true;
      
      // Move camera back to a sensible orbit position
      camera.position.copy(originalCameraPos);
      controls.target.copy(originalTarget);
      controls.autoRotate = true;
      
      // Hide overlay
      fpOverlay.classList.remove('visible');
      fpBtn.classList.remove('active');
      
      console.log('First Person Mode OFF');
    }
    
    window.toggleFirstPerson = function() {
      if (firstPersonActive) {
        exitFirstPerson();
      } else {
        enterFirstPerson();
      }
    };

    init();
  </script>
