<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULT â€“ 3D Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: #e8eaed;
      overflow: hidden;
    }
    #container { width: 100vw; height: 100vh; position: relative; }
    #canvas-container {
      width: 100%; height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #canvas-container canvas { display: block; }
    #lazy-load-overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      background: linear-gradient(135deg, rgba(245, 247, 250, 0.95) 0%, rgba(232, 236, 241, 0.98) 100%);
      backdrop-filter: blur(8px);
      text-align: center;
    }
    #lazy-load-overlay.hidden {
      display: none;
    }
    #lazy-load-overlay .poster-wrap {
      width: min(92vw, 520px);
      aspect-ratio: 16 / 10;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(28, 28, 28, 0.12);
      border: 1px solid rgba(28, 28, 28, 0.08);
    }
    #lazy-load-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #lazy-load-overlay .lazy-copy {
      max-width: 420px;
      color: rgba(28, 28, 28, 0.65);
      font-size: 14px;
      line-height: 1.5;
    }
    #lazy-load-overlay #lazy-load-btn {
      pointer-events: auto;
      margin-top: 4px;
      padding: 14px 28px;
      border-radius: 999px;
      border: none;
      background: #14B8A6;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(20, 184, 166, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #lazy-load-overlay #lazy-load-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(20, 184, 166, 0.45);
    }

    #canvas-container.resizing canvas { transition: opacity 0.15s ease-out; }
    .top-bar {
      position: absolute;
      top: clamp(12px, 3vw, 24px);
      left: clamp(12px, 3vw, 24px);
      right: clamp(12px, 3vw, 24px);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
    }
    .stats { display: flex; flex-direction: column; gap: 6px; }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: clamp(12px, 2.5vw, 14px);
      color: rgba(28, 28, 28, 0.6);
      border: 1px solid rgba(28, 28, 28, 0.06);
    }
    .stat-item .label { text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
    .stat-item .value { color: rgba(28, 28, 28, 0.9); font-weight: 600; font-variant-numeric: tabular-nums; }
    .controls {
      position: absolute;
      bottom: 0; left: 0; right: 0; top: 0;
      pointer-events: none;
      z-index: 10;
    }
    .controls-inner {
      position: absolute;
      bottom: clamp(12px, 3vw, 24px);
      left: clamp(12px, 3vw, 24px);
      right: clamp(12px, 3vw, 24px);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      gap: 8px;
    }
    .controls-inner .btn { pointer-events: auto; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: clamp(44px, 12vmin, 56px);
      height: clamp(44px, 12vmin, 56px);
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(28, 28, 28, 0.1);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgba(28, 28, 28, 0.7);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 12px rgba(28, 28, 28, 0.08);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.95);
      color: rgba(28, 28, 28, 0.9);
      transform: scale(1.05);
    }
    .btn.active { background: #14B8A6; color: white; border-color: #14B8A6; }
    .btn svg { width: clamp(20px, 5vmin, 24px); height: clamp(20px, 5vmin, 24px); }
    .btn-icon-only .btn-text {
      position: absolute;
      width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(28, 28, 28, 0.6);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(20, 184, 166, 0.2);
      border-top-color: #14B8A6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading.hidden { display: none; }
  
    /* lazy-overlay mobile tune v1 */
    /* Narrow viewer panes (modal on phones) — shrink poster + copy so the
       overlay fits in ~320x180 without overflow. */
    @media (max-height: 360px), (max-width: 480px) {
      #lazy-load-overlay { gap: 10px; padding: 12px; }
      #lazy-load-overlay .poster-wrap { width: min(70%, 220px); border-radius: 12px; }
      #lazy-load-overlay .lazy-copy { font-size: 12px; line-height: 1.35; max-width: 280px; }
      #lazy-load-overlay #lazy-load-btn { padding: 10px 18px; font-size: 13px; }
    }
    /* Extreme case (e.g. landscape phone modal): no room for a poster — hide it. */
    @media (max-height: 220px) {
      #lazy-load-overlay .poster-wrap { display: none; }
      #lazy-load-overlay { gap: 8px; padding: 10px; }
    }

  </style>
</head>
<body>
  <div id="container">
    <div id="canvas-container"></div>

    <div id="lazy-load-overlay">
      <div class="poster-wrap">
        <img src="./pult-praesentation-5.webp" alt="" width="960" height="600" decoding="async" fetchpriority="high" />
      </div>
      <p class="lazy-copy">Das interaktive 3D-Modell lädt erst beim Tippen — weniger Daten beim ersten Laden.</p>
      <button type="button" id="lazy-load-btn">3D-Ansicht laden</button>
    </div>

    <div class="loading hidden" id="loading">
      <div class="spinner"></div>
      <p>Loading 3D Model...</p>
      <p id="progress" style="font-size: 12px; margin-top: 8px; opacity: 0.7;"></p>
    </div>
    <div class="top-bar">
      <div class="stats" id="stats">
        <div class="stat-item">
          <span class="label">Vertices</span>
          <span class="value" id="vertex-count">â€”</span>
        </div>
        <div class="stat-item">
          <span class="label">Triangles</span>
          <span class="value" id="triangle-count">â€”</span>
        </div>
      </div>
    </div>
    <div class="controls">
      <div class="controls-inner">
        <button class="btn btn-icon-only" id="wireframe-btn" onclick="toggleWireframe()" title="Wireframe">
          <span class="btn-text" aria-hidden="true">Wireframe</span>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/>
          </svg>
        </button>
        <button class="btn btn-icon-only" id="animation-btn" onclick="toggleAnimation()" title="Play Animation" style="display: none;">
          <span class="btn-text" id="animation-text" aria-hidden="true">Play</span>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    let scene, camera, renderer, controls;
    let model, wireframeGroup, gridHelper;
    let mixer, animationAction, clock;
    let showWireframe = false;
    let isPlaying = false;
    let isAnimating = false;
    let rafId = null;
    let animationTimeoutId = null;
    let isHidden = false;

    const ORANGE_ACCENT = 0xFF8C00;
    const container = document.getElementById('canvas-container');
    const loadingEl = document.getElementById('loading');
    const progressEl = document.getElementById('progress');
    const wireframeBtn = document.getElementById('wireframe-btn');
    const animationBtn = document.getElementById('animation-btn');
    const animationText = document.getElementById('animation-text');
    const vertexCountEl = document.getElementById('vertex-count');
    const triangleCountEl = document.getElementById('triangle-count');

    clock = new THREE.Clock();
    function wireLazyModelLoad() {
      const lazyOverlay = document.getElementById('lazy-load-overlay');
      const lazyBtn = document.getElementById('lazy-load-btn');
      if (!lazyOverlay || !lazyBtn) return;
      lazyBtn.addEventListener('click', async () => {
        lazyOverlay.classList.add('hidden');
        loadingEl.classList.remove('hidden');
        try {
          await loadModel();
        } catch (_) {
          loadingEl.classList.add('hidden');
          lazyOverlay.classList.remove('hidden');
        }
      });
    }



    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe8eaed);

      const width = container.clientWidth;
      const height = container.clientHeight;
      camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
      camera.position.set(0, 0.8, 4.5);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.4;
      controls.enablePan = true;
      controls.minDistance = 2;
      controls.maxDistance = 12;
      controls.target.set(0, 0.2, 0);

      // SchÃ¶ne Beleuchtung â€“ produktorientiert
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x888888, 0.5);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 1.4);
      mainLight.position.set(-5, 12, 8);
      mainLight.castShadow = true;
      mainLight.shadow.mapSize.width = 2048;
      mainLight.shadow.mapSize.height = 2048;
      mainLight.shadow.camera.near = 1;
      mainLight.shadow.camera.far = 25;
      mainLight.shadow.camera.left = -5;
      mainLight.shadow.camera.right = 5;
      mainLight.shadow.camera.top = 5;
      mainLight.shadow.camera.bottom = -5;
      mainLight.shadow.bias = -0.0005;
      mainLight.shadow.normalBias = 0.02;
      scene.add(mainLight);

      const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
      fillLight.position.set(5, 5, 5);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight(0x88ccff, 0.25);
      rimLight.position.set(0, 5, -10);
      scene.add(rimLight);

      const groundSize = 12;
      const groundGeo = new THREE.PlaneGeometry(groundSize, groundSize);
      const shadowMat = new THREE.ShadowMaterial({ opacity: 0.25, color: 0x000000 });
      const groundPlane = new THREE.Mesh(groundGeo, shadowMat);
      groundPlane.rotation.x = -Math.PI / 2;
      groundPlane.position.y = -0.8;
      groundPlane.receiveShadow = true;
      scene.add(groundPlane);

      // Grid wie bei Maske/Roboter – gleiche Grafik-Optik
      gridHelper = new THREE.GridHelper(12, 24, 0x14B8A6, 0xcccccc);
      gridHelper.material.opacity = 0.15;
      gridHelper.material.transparent = true;
      gridHelper.position.y = -0.8;
      scene.add(gridHelper);

      wireLazyModelLoad();
      window.addEventListener('resize', onResize);
      window.addEventListener('keydown', onKeyDown);
      // start rendering only when tab is visible to avoid background memory/CPU growth
      if (!document.hidden) animate();
      // pause/resume when tab visibility changes
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          isHidden = true;
          pauseRendering();
        } else {
          isHidden = false;
          resumeRendering();
        }
      });
    }

    function pauseRendering(){
      if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
      // stop controls auto-rotate to avoid work
      try{ if(controls) controls.autoRotate = false; }catch(e){}
    }

    function resumeRendering(){
      try{ if(controls) controls.autoRotate = true; }catch(e){}
      // reset clock so delta doesn't spike
      clock = new THREE.Clock();
      if(!rafId) rafId = requestAnimationFrame(animate);
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toLocaleString();
    }

    function countGeometry(object) {
      let vertices = 0;
      let triangles = 0;
      object.traverse((child) => {
        if (child.isMesh && child.geometry) {
          const geo = child.geometry;
          if (geo.index) triangles += geo.index.count / 3;
          else if (geo.attributes.position) triangles += geo.attributes.position.count / 3;
          if (geo.attributes.position) vertices += geo.attributes.position.count;
        }
      });
      return { vertices, triangles: Math.floor(triangles) };
    }

    function loadModel() {
      const loader = new FBXLoader();
      loader.load(
        './model.fbx',
        (fbx) => {
          const box0 = new THREE.Box3().setFromObject(fbx);
          const size0 = box0.getSize(new THREE.Vector3());
          const maxDim = Math.max(size0.x, size0.y, size0.z);
          const scale = 2.4 / maxDim;

          fbx.rotation.x = 0;
          fbx.scale.setScalar(scale);
          fbx.position.set(0, 0, 0);
          fbx.updateMatrixWorld(true);

          const boxRotated = new THREE.Box3().setFromObject(fbx);
          const centerRotated = boxRotated.getCenter(new THREE.Vector3());
          const minY = boxRotated.min.y;
          fbx.position.set(-centerRotated.x, -minY - 0.8, -centerRotated.z);

          fbx.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;

              // Detect actual flat planes (PNG decals): very few vertices + has texture
              const geo = child.geometry;
              const vtxCount = geo && geo.attributes && geo.attributes.position ? geo.attributes.position.count : 999;
              const meshName = (child.name || '').toLowerCase();
              const nameHintPlane = meshName.includes('plane') || meshName.includes('label') || meshName.includes('logo') ||
                meshName.includes('sign') || meshName.includes('decal') || meshName.includes('bild');
              const isActualPlane = vtxCount <= 6 && nameHintPlane;

              if (child.material) {
                // If this is a real flat plane with a texture → transparent PNG material
                const matArr = Array.isArray(child.material) ? child.material : [child.material];
                if (isActualPlane && matArr.some(m => m.map)) {
                  const mat = matArr[0];
                  if (mat.map) {
                    const tex = mat.map;
                    tex.colorSpace = THREE.SRGBColorSpace;
                    child.material = new THREE.MeshBasicMaterial({
                      map: tex,
                      transparent: true,
                      side: THREE.DoubleSide,
                      depthWrite: false,
                      alphaTest: 0.05,
                    });
                    child.castShadow = false;
                    child.renderOrder = 1;
                    return; // skip normal material handling for this mesh
                  }
                }

                const mats = Array.isArray(child.material) ? child.material : [child.material];
                const newMats = mats.map((mat) => {
                  const matName = (mat.name || '').toLowerCase();
                  const r = mat.color?.r ?? 0.5, g = mat.color?.g ?? 0.5, b = mat.color?.b ?? 0.5;

                  if (matName.includes('orange') || matName.includes('accent') || matName.includes('copper') || matName.includes('gold') ||
                      (r > 0.6 && g > 0.3 && b < 0.35)) {
                    return new THREE.MeshStandardMaterial({
                      color: new THREE.Color(ORANGE_ACCENT),
                      roughness: 0.25,
                      metalness: 0.5,
                      side: THREE.DoubleSide,
                    });
                  }
                  if (matName.includes('black') || matName.includes('dark') || (r < 0.2 && g < 0.2 && b < 0.2)) {
                    return new THREE.MeshStandardMaterial({
                      color: new THREE.Color(0x1a1a1a),
                      roughness: 0.35,
                      metalness: 0.6,
                      side: THREE.DoubleSide,
                    });
                  }
                  if (matName.includes('gray') || matName.includes('grey') || matName.includes('metal') || matName.includes('gear')) {
                    return new THREE.MeshStandardMaterial({
                      color: new THREE.Color(0x888888),
                      roughness: 0.4,
                      metalness: 0.7,
                      side: THREE.DoubleSide,
                    });
                  }
                  if (matName.includes('white') || matName.includes('body') || (r > 0.85 && g > 0.85 && b > 0.85)) {
                    return new THREE.MeshStandardMaterial({
                      color: new THREE.Color(0xf5f5f0),
                      roughness: 0.5,
                      metalness: 0.1,
                      side: THREE.DoubleSide,
                    });
                  }
                  const hasTex = !!mat.map;
                  if (hasTex && mat.map) {
                    mat.map.colorSpace = THREE.SRGBColorSpace;
                  }
                  return new THREE.MeshStandardMaterial({
                    color: hasTex ? new THREE.Color(0xffffff) : (mat.color ? mat.color.clone() : new THREE.Color(0xcccccc)),
                    map: hasTex ? mat.map : null,
                    transparent: hasTex,
                    alphaTest: hasTex ? 0.05 : 0,
                    side: THREE.DoubleSide,
                    roughness: 0.45,
                    metalness: hasTex ? 0.0 : 0.4,
                  });
                });
                child.material = Array.isArray(child.material) ? newMats : newMats[0];
              }
            }
          });

          scene.add(fbx);
          model = fbx;

          if (fbx.animations && fbx.animations.length > 0) {
            mixer = new THREE.AnimationMixer(fbx);
            const clip = fbx.animations[0];
            animationAction = mixer.clipAction(clip);
            animationAction.setLoop(THREE.LoopOnce, 1);
            animationAction.clampWhenFinished = true;
            animationAction.play();
            animationAction.paused = true;
            animationAction.time = 0;
            mixer.addEventListener('finished', () => { isAnimating = false; });
            animationBtn.style.display = 'flex';
          }

          const stats = countGeometry(fbx);
          vertexCountEl.textContent = formatNumber(stats.vertices);
          triangleCountEl.textContent = formatNumber(stats.triangles);

          wireframeGroup = new THREE.Group();
          fbx.traverse((child) => {
            if (child.isMesh) {
              const wireGeo = new THREE.WireframeGeometry(child.geometry);
              const wireMat = new THREE.LineBasicMaterial({ color: 0x14B8A6, transparent: true, opacity: 0.7 });
              const wire = new THREE.LineSegments(wireGeo, wireMat);
              wire.position.copy(child.position);
              wire.rotation.copy(child.rotation);
              wire.scale.copy(child.scale);
              wireframeGroup.add(wire);
            }
          });
          wireframeGroup.scale.copy(fbx.scale);
          wireframeGroup.position.copy(fbx.position);
          wireframeGroup.visible = false;
          scene.add(wireframeGroup);

          loadingEl.classList.add('hidden');
        },
        (progress) => {
          if (progress.total > 0)
            progressEl.textContent = Math.round((progress.loaded / progress.total) * 100) + '%';
        },
        (error) => {
          console.error('Error loading model:', error);
          progressEl.textContent = 'Failed to load model';
        }
      );
    }

    function onResize() {
      const width = container.clientWidth;
      const height = container.clientHeight;
      if (width === 0 || height === 0) return;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    const zoomStep = 0.4;
    const minDist = 2;
    const maxDist = 12;
    function onKeyDown(e) {
      if (!controls || !camera) return;
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
        const dist = camera.position.distanceTo(controls.target);
        if (e.key === 'ArrowUp') {
          const newDist = Math.max(minDist, dist - zoomStep);
          camera.position.copy(controls.target).add(dir.multiplyScalar(newDist));
        } else {
          const newDist = Math.min(maxDist, dist + zoomStep);
          camera.position.copy(controls.target).add(dir.multiplyScalar(newDist));
        }
      }
    }

    function animate() {
      rafId = requestAnimationFrame(animate);
      let delta = clock.getDelta();
      if (delta > 0.1) delta = 0.016;
      if (mixer) mixer.update(delta);
      controls.update();
      if (model && wireframeGroup) {
        wireframeGroup.rotation.copy(model.rotation);
        wireframeGroup.position.copy(model.position);
      }
      renderer.render(scene, camera);
    }

    window.toggleAnimation = function() {
      if (!animationAction || isAnimating) return;
      const clip = animationAction.getClip();
      if (clip.duration <= 0) return;
      clock = new THREE.Clock();
      isAnimating = true;
      if (isPlaying) {
        animationAction.stop();
        animationAction.time = clip.duration;
        animationAction.timeScale = -1;
        animationAction.paused = false;
        animationAction.play();
        isPlaying = false;
        animationText.textContent = 'Play';
      } else {
        animationAction.stop();
        animationAction.reset();
        animationAction.timeScale = 1;
        animationAction.paused = false;
        animationAction.play();
        isPlaying = true;
        animationText.textContent = 'Reverse';
      }
      if (animationTimeoutId) clearTimeout(animationTimeoutId);
      animationTimeoutId = setTimeout(() => { isAnimating = false; animationTimeoutId = null; }, (clip.duration * 1000) + 200);
    };

    window.toggleWireframe = function() {
      showWireframe = !showWireframe;
      if (wireframeGroup) wireframeGroup.visible = showWireframe;
      wireframeBtn.classList.toggle('active', showWireframe);
    };

    init();

    // Dispose helpers â€” non-invasive: only run on teardown (pagehide / beforeunload)
    function disposeMesh(mesh){
      try{
        if(mesh.geometry){ mesh.geometry.dispose(); }
        if(mesh.material){
          const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
          mats.forEach(m=>{
            if(!m) return;
            if(m.map) m.map.dispose();
            if(m.lightMap) m.lightMap.dispose && m.lightMap.dispose();
            if(m.emissiveMap) m.emissiveMap.dispose && m.emissiveMap.dispose();
            if(m.normalMap) m.normalMap.dispose && m.normalMap.dispose();
            if(m.metalnessMap) m.metalnessMap.dispose && m.metalnessMap.dispose();
            if(m.roughnessMap) m.roughnessMap.dispose && m.roughnessMap.dispose();
            if(m.dispose) m.dispose();
          });
        }
      }catch(e){ console.warn('disposeMesh error', e); }
    }

    function disposeScene(root){
      try{
        if(!root) return;
        root.traverse((node)=>{
          if(node.isMesh){ disposeMesh(node); }
        });
      }catch(e){ console.warn('disposeScene error', e); }
    }

    function cleanup(){
      // stop RAF
      if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
      // stop mixer
      try{
        if(mixer){ mixer.stopAllAction && mixer.stopAllAction(); if(model) mixer.uncacheRoot && mixer.uncacheRoot(model); mixer = null; }
      }catch(e){ }
      // remove controls
      try{ controls?.dispose && controls.dispose(); controls = null; }catch(e){}
      try{ window.removeEventListener('resize', onResize); }catch(e){}
      try{ window.removeEventListener('keydown', onKeyDown); }catch(e){}
      // clear timeouts
      try{ if(animationTimeoutId) { clearTimeout(animationTimeoutId); animationTimeoutId = null; } }catch(e){}
      // dispose scene meshes and renderer
      try{
        disposeScene(scene);
        if(renderer){ renderer.dispose && renderer.dispose(); if(renderer.domElement && renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement); renderer = null; }
      }catch(e){ console.warn('cleanup error', e); }
    }

    // Run cleanup when leaving the page to avoid leaked GPU/JS memory across navigations
    window.addEventListener('pagehide', cleanup, { once: true });
    window.addEventListener('beforeunload', cleanup, { once: true });
  </script>
</body>
